name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Ctimer-windows-x64
          path: |
            dist/Ctimer-v*.exe
            dist/Ctimer-v*-win-x64.zip
            dist/SHA256SUMS-v*.txt
          if-no-files-found: error
